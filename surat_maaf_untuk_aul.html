<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Untuk Aul ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }
        /* Envelope / Cover */
        #envelope {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 135, 0.2);
            text-align: center;
            cursor: pointer;
            transition: all 0.5s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            border: 2px dashed #ffb6c1;
        }
        #envelope:hover {
            transform: translate(-50%, -52%);
            box-shadow: 0 15px 30px rgba(255, 105, 135, 0.3);
        }
        #envelope h2 {
            color: #ff4d6d;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .cute-img {
            width: 200px;
            max-width: 100%;
            border-radius: 15px;
            margin: 15px 0;
        }
        .tap-text {
            color: #ff8fa3;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Inside Letter */
        #letter {
            background: #fff0f3;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.3);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translate(-50%, -50%);
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 1px solid #ffccd5;
        }
        #letter.open {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translate(-50%, -50%);
        }
        #envelope.hide {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.2) translate(-50%, -50%);
        }
        #letter p {
            color: #590d22;
            font-size: 18px;
            line-height: 1.6;
            margin-top: 20px;
            font-weight: 500;
        }

        /* Falling Hearts */
        .falling-heart {
            position: absolute;
            top: -10vh;
            color: #ff4d6d;
            font-size: 24px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>

    <script>
        let isOpened = false;

        function openLetter() {
            if (isOpened) return;
            isOpened = true;
            
            document.getElementById('envelope').classList.add('hide');
            document.getElementById('letter').classList.add('open');
            
            // Mulai hujan love
            startFallingHearts();
        }

        function startFallingHearts() {
            // Buat hati pertama langsung banyak biar meriah
            for(let i=0; i<15; i++) {
                setTimeout(createHeart, Math.random() * 500);
            }
            
            // Lanjut turun terus menerus
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            
            // Randomize love emoji
            const hearts = ['❤️', '💖', '💕', '💗', '💓'];
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            // Randomize position and size
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            document.body.appendChild(heart);
            
            // Hapus element setelah animasi selesai biar gak berat
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
